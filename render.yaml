services:
  # MentorAI Express Backend Web Service
  - type: web
    name: reminder-app-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build && npm run prisma:push && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: ENABLE_BROWSER_NOTIFICATIONS
        value: "true"
      - key: ENABLE_SOUND_ALERTS
        value: "true"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: reminder-app-frontend
          property: host

  # MentorAI Vite/React Frontend Static Site
  - type: web
    name: reminder-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reminder-app-backend
          property: host
